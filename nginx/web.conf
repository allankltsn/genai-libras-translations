# Serve dist/ e encaminha /v1 para a API. A CSP vem do <meta> do build (nao duplicada aqui);
# o header abaixo acrescenta so frame-ancestors (CSPs se combinam, vale a mais restritiva).
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 16k;   # API aceita corpo ate 8 KB

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }

    location /v1/ {
        limit_except GET POST { deny all; }
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Sobrescreve (nao anexa) o que o cliente mandou; a API tambem ignora XFF de nao-loopback.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }
}
